      # ===== مرحله ۷: همگام‌سازی Capacitor با اندروید =====
      # این دستور فایل‌های وب رو به پوشه‌ی اندروید کپی میکنه و تنظیمات رو انجام میده
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ===== مرحله ۸: ساخت فایل APK (نسخه‌ی Debug) =====
      # اینجا با استفاده از Gradle (ابزار ساخت اندروید) فایل APK رو میسازیم
      # فایل خروجی در مسیر android/app/build/outputs/apk/debug/ قرار میگیره
      - name: Build Debug APK
        run: |
          cd android                 # وارد پوشه‌ی اندروید میشیم
          chmod +x gradlew           # به فایل gradlew (ابزار Gradle) اجازه‌ی اجرا میدیم
          ./gradlew assembleDebug    # دستور ساخت نسخه‌ی Debug (برای تست)

      # ===== مرحله ۹: آپلود فایل APK به عنوان Artifact =====
      # فایل ساخته‌شده رو به GitHub آپلود میکنیم تا بعداً بتونیم دانلودش کنیم
      - name: Upload APK
        uses: actions/upload-artifact@v4
