name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-g9d-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-g9d-

      - name: Gradle resilience
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          systemProp.org.gradle.internal.http.connectionTimeout=180000
          systemProp.org.gradle.internal.http.socketTimeout=180000
          systemProp.org.gradle.internal.repository.max.retries=15
          systemProp.org.gradle.internal.repository.max.tentatives=15
          systemProp.org.gradle.internal.repository.initial.backoff=3000
          EOF

      - name: Lock android flags
        run: |
          touch android/gradle.properties
          grep -q '^android.newDsl=' android/gradle.properties \
            && sed -i 's/^android.newDsl=.*/android.newDsl=false/' android/gradle.properties \
            || echo 'android.newDsl=false' >> android/gradle.properties
          grep -q '^android.builtInKotlin=' android/gradle.properties \
            && sed -i 's/^android.builtInKotlin=.*/android.builtInKotlin=true/' android/gradle.properties \
            || echo 'android.builtInKotlin=true' >> android/gradle.properties
          # Remove dangerous evaluationDependsOn if Flutter reintroduces it
          sed -i '/evaluationDependsOn/d' android/build.gradle.kts || true
          sed -i 's/compileSdk = [0-9]\+/compileSdk = 36/' android/app/build.gradle.kts || true
          sed -i '/id("org.jetbrains.kotlin.android")/d' android/app/build.gradle.kts || true
          sed -i '/id("kotlin-android")/d' android/app/build.gradle.kts || true
          # Ensure api_config exists
          if [ ! -f lib/core/config/api_config.dart ]; then
            if [ -f lib/core/config/api_config.example.dart ]; then
              cp lib/core/config/api_config.example.dart lib/core/config/api_config.dart
            else
              mkdir -p lib/core/config
              printf '%s\n' 'class ApiConfig {' "  static const String wpBaseUrl = 'https://ezlens.ir';" "  static const String wpUsername = '';" "  static const String wpAppPassword = '';" "  static const String wcConsumerKey = '';" "  static const String wcConsumerSecret = '';" '}' > lib/core/config/api_config.dart
            fi
          fi

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: |
          set -o pipefail
          sed -i '/evaluationDependsOn/d' android/build.gradle.kts || true
          sed -i 's/compileSdk = [0-9]\+/compileSdk = 36/' android/app/build.gradle.kts || true
          flutter build apk --release 2>&1 | tee build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: List APK
        if: always()
        run: find build -name "*.apk" 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ezlens-manager-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
