# Path in repo: .github/workflows/android-ci.yml
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle network resilience
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties << 'EOF'
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          systemProp.org.gradle.internal.http.connectionTimeout=120000
          systemProp.org.gradle.internal.http.socketTimeout=120000
          systemProp.org.gradle.internal.repository.max.retries=10
          systemProp.org.gradle.internal.repository.max.tentatives=10
          systemProp.org.gradle.internal.repository.initial.backoff=2000
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Ensure api_config exists
        run: |
          if [ ! -f lib/core/config/api_config.dart ]; then
            if [ -f lib/core/config/api_config.example.dart ]; then
              cp lib/core/config/api_config.example.dart lib/core/config/api_config.dart
            else
              mkdir -p lib/core/config
              printf '%s\n' \
                'class ApiConfig {' \
                "  static const String wpBaseUrl = 'https://ezlens.ir';" \
                "  static const String wpUsername = '';" \
                "  static const String wpAppPassword = '';" \
                "  static const String wcConsumerKey = '';" \
                "  static const String wcConsumerSecret = '';" \
                '}' > lib/core/config/api_config.dart
            fi
          fi

      # Maven Central sometimes returns HTTP 429 on shared runners — retry with backoff
      - name: Build APK (with retries)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 4
          retry_wait_seconds: 90
          command: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ezlens-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
