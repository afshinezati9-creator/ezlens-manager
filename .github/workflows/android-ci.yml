# Path: .github/workflows/android-ci.yml
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Gradle resilience
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties << 'EOF'
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          systemProp.org.gradle.internal.http.connectionTimeout=180000
          systemProp.org.gradle.internal.http.socketTimeout=180000
          systemProp.org.gradle.internal.repository.max.retries=15
          systemProp.org.gradle.internal.repository.max.tentatives=15
          systemProp.org.gradle.internal.repository.initial.backoff=3000
          EOF

      - name: Pub get
        run: flutter pub get

      - name: Ensure api_config.dart
        run: |
          if [ ! -f lib/core/config/api_config.dart ]; then
            if [ -f lib/core/config/api_config.example.dart ]; then
              cp lib/core/config/api_config.example.dart lib/core/config/api_config.dart
            else
              mkdir -p lib/core/config
              cat > lib/core/config/api_config.dart << 'DART'
          class ApiConfig {
            static const String wpBaseUrl = 'https://ezlens.ir';
            static const String wpUsername = '';
            static const String wpAppPassword = '';
            static const String wcConsumerKey = '';
            static const String wcConsumerSecret = '';
          }
          DART
            fi
          fi
          # Show which files import ApiConfig
          echo "=== api_config.dart exists ==="
          ls -la lib/core/config/ || true

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee build-log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

      - name: List APK outputs
        if: always()
        run: |
          echo "=== Looking for APK ==="
          find build -name "*.apk" 2>/dev/null || echo "No APK found"
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ezlens-manager-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
