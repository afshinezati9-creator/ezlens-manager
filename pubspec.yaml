name: ezlens_manager
description: "EzLens Manager - Flutter Project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  go_router: ^14.6.2
  image_picker: ^1.2.3
  persian_datetime_picker: ^3.2.0
  url_launcher: ^6.2.0
  file_picker: ^8.0.0
  intl: ^0.19.0
  equatable: ^2.0.5
  open_file: ^3.3.2
  clipboard: ^0.1.3

  # ===== اضافات برای دانلود فایل =====
  path_provider: ^2.1.2
  permission_handler: ^11.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true