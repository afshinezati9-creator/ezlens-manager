name: ezlens_manager
description: "EzLens Manager - Flutter Project"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ===== UI & Icons =====
  cupertino_icons: ^1.0.8

  # ===== State Management =====
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  equatable: ^2.0.5

  # ===== Networking =====
  dio: ^5.7.0

  # ===== Storage =====
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  path_provider: ^2.1.2

  # ===== Navigation =====
  go_router: ^14.6.2

  # ===== Media & Files =====
  image_picker: ^1.2.3
  file_picker: ^8.0.0
  open_file: ^3.3.2
  permission_handler: ^11.0.1

  # ===== Utilities =====
  url_launcher: ^6.2.0
  intl: ^0.19.0
  persian_datetime_picker: ^3.2.0
  clipboard: ^0.1.3

  # ===== Charts =====
  fl_chart: ^0.69.0

  # ===== Security (Biometric) =====
  local_auth: ^2.3.0

  # ===== Notifications =====
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.13
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_ez.png