<!doctype html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>EzLens Manager</title>

    <!-- فونت وزیر -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" />

    <style>
        /* ===== ریست و تنظیمات پایه ===== */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --primary: #031f8a;
            --primary-light: #3a5fd9;
            --accent: #ff6b6d;
            --bg-start: #f0f4fe;
            --bg-end: #d9e2f5;
            --text-dark: #0b1a33;
            --text-muted: #4a5a7a;
            --shadow-card: 0 30px 60px -20px rgba(3, 31, 138, 0.25);
        }

        html,
        body {
            height: 100%;
            font-family: 'Vazir', 'IRANYekan', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, var(--bg-start) 0%, var(--bg-end) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            margin: 0;
            direction: rtl;
            overflow: hidden;
        }

        /* ===== کانتینر اصلی ===== */
        .wrapper {
            position: relative;
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(18px) saturate(180%);
            -webkit-backdrop-filter: blur(18px) saturate(180%);
            border-radius: 40px;
            padding: 2.8rem 2rem 3rem;
            box-shadow: var(--shadow-card);
            border: 1px solid rgba(255, 255, 255, 0.45);
            text-align: center;
            z-index: 10;
            transition: transform 0.3s ease;
        }

        @media (max-width: 480px) {
            .wrapper {
                padding: 2rem 1.2rem 2.4rem;
                border-radius: 32px;
            }
        }

        @media (max-width: 380px) {
            .wrapper {
                padding: 1.6rem 0.8rem 2rem;
                border-radius: 28px;
            }
        }

        /* ===== لوگو ===== */
        .logo-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 0.2rem;
        }

        .logo-img {
            width: 110px;
            height: 110px;
            border-radius: 30px;
            object-fit: cover;
            box-shadow: 0 12px 28px rgba(3, 31, 138, 0.18);
            background: #fff;
            padding: 6px;
            border: 2px solid rgba(255, 255, 255, 0.6);
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
            animation: floatLogo 4s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
            100% { transform: translateY(0) scale(1); }
        }

        .logo-img:hover {
            transform: scale(1.04) rotate(-1.5deg);
        }

        @media (max-width: 480px) {
            .logo-img {
                width: 90px;
                height: 90px;
                border-radius: 24px;
                padding: 4px;
            }
        }

        @media (max-width: 380px) {
            .logo-img {
                width: 75px;
                height: 75px;
                border-radius: 20px;
            }
        }

        /* ===== پیام اصلی ===== */
        .message-title {
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: 0.6rem;
            letter-spacing: -0.5px;
            line-height: 1.3;
        }

        .message-sub {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 0.4rem;
            opacity: 0.8;
            line-height: 1.8;
        }

        /* ===== اسپینر مدرن ===== */
        .spinner-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 1rem;
            margin: 1.6rem 0 0.4rem;
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(3, 31, 138, 0.10);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .spinner-label {
            font-size: 1rem;
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* ===== فوتر ===== */
        .footer-note {
            margin-top: 2rem;
            font-size: 0.7rem;
            color: var(--text-muted);
            opacity: 0.35;
            letter-spacing: 0.5px;
        }

        /* ===== کانتینر حباب‌ها ===== */
        .bubbles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(3, 31, 138, 0.10));
            box-shadow: 0 8px 24px rgba(3, 31, 138, 0.06);
            pointer-events: none;
            will-change: transform, opacity;
            animation: floatUp 1.8s ease-out forwards;
        }

        .bubble:nth-child(odd) {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(255, 107, 109, 0.13));
        }
        .bubble:nth-child(3n) {
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.9), rgba(58, 95, 217, 0.12));
        }

        @keyframes floatUp {
            0% {
                transform: translate(0, 0) scale(0.2);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tx), var(--ty)) scale(1.2);
                opacity: 0;
            }
        }

        /* ===== حالت تاریک (اختیاری) ===== */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-start: #0b1120;
                --bg-end: #1a2538;
                --text-dark: #f1f5f9;
                --text-muted: #94a3b8;
                --shadow-card: 0 30px 60px -20px rgba(0, 0, 0, 0.7);
            }
            .wrapper {
                background: rgba(20, 30, 50, 0.70);
                backdrop-filter: blur(20px) saturate(180%);
                -webkit-backdrop-filter: blur(20px) saturate(180%);
                border-color: rgba(255, 255, 255, 0.06);
            }
            .message-title {
                color: #c7d9ff;
            }
            .message-sub {
                color: #8a9ab8;
            }
            .spinner {
                border-color: rgba(255, 255, 255, 0.08);
                border-top-color: #6d8fff;
            }
            .spinner-label {
                color: #8a9ab8;
            }
            .logo-img {
                background: #1a2538;
                border-color: rgba(255, 255, 255, 0.06);
            }
        }
    </style>
</head>
<body>

    <!-- ===== کانتینر حباب‌ها ===== -->
    <div class="bubbles-container" id="bubbleContainer"></div>

    <!-- ===== باکس اصلی ===== -->
    <main class="wrapper" role="main" aria-label="صفحه مدیریت ایزی‌لنز">

        <!-- لوگو -->
        <div class="logo-wrap">
            <img class="logo-img"
                 src="https://ezlens.ir/wp-content/uploads/2026/07/cropped-logo-500x500-1.webp"
                 alt="لوگوی EzLens"
                 width="110"
                 height="110"
                 loading="lazy"
            />
        </div>

        <h1 class="message-title">در حال اتصال به سرور...</h1>
        <p class="message-sub">لطفاً چند لحظه صبر کنید</p>

        <!-- اسپینر -->
        <div class="spinner-wrapper">
            <div class="spinner" role="status" aria-label="در حال بارگذاری"></div>
            <span class="spinner-label">در حال برقراری ارتباط</span>
        </div>

        <div class="footer-note">© ۱۴۰۴ · EzLens</div>
    </main>

    <script>
        (function() {
            'use strict';

            // ===== ۱. افکت حباب‌ها با کلیک/لمس =====
            const container = document.getElementById('bubbleContainer');
            let bubbleCount = 0;
            const MAX_BUBBLES = 50;

            function createBubble(clientX, clientY) {
                if (bubbleCount >= MAX_BUBBLES) {
                    const oldBubble = container.querySelector('.bubble');
                    if (oldBubble) {
                        oldBubble.remove();
                        bubbleCount--;
                    }
                }

                const bubble = document.createElement('div');
                bubble.className = 'bubble';

                const size = 18 + Math.random() * 45;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';

                const offset = size / 2;
                bubble.style.left = (clientX - offset) + 'px';
                bubble.style.top = (clientY - offset) + 'px';

                const tx = (Math.random() - 0.5) * 200;
                const ty = -100 - Math.random() * 220;
                bubble.style.setProperty('--tx', tx + 'px');
                bubble.style.setProperty('--ty', ty + 'px');

                const duration = 1.0 + Math.random() * 1.4;
                bubble.style.animationDuration = duration + 's';

                container.appendChild(bubble);
                bubbleCount++;

                bubble.addEventListener('animationend', function() {
                    this.remove();
                    bubbleCount--;
                });
            }

            function handlePointer(e) {
                let clientX, clientY;
                if (e.touches) {
                    const touch = e.touches[0];
                    clientX = touch.clientX;
                    clientY = touch.clientY;
                } else {
                    clientX = e.clientX;
                    clientY = e.clientY;
                }
                createBubble(clientX, clientY);
            }

            // رویدادهای کلیک و لمس روی کل سند
            document.addEventListener('click', handlePointer);
            document.addEventListener('touchstart', handlePointer, { passive: true });

            // ===== ۲. ایجاد چند حباب اولیه برای خوش‌آمدگویی =====
            window.addEventListener('load', function() {
                const delays = [200, 600, 1000, 1400, 1800];
                delays.forEach((delay) => {
                    setTimeout(() => {
                        const x = 60 + Math.random() * (window.innerWidth - 120);
                        const y = 60 + Math.random() * (window.innerHeight - 120);
                        createBubble(x, y);
                    }, delay);
                });
            });

        })();
    </script>

</body>
</html>
